version: "3"

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
    environment:
      TZ: 'Asia/Manila'
    volumes:
      - '/docker/appdata/pi-hole/etc-pihole:/etc/pihole'
      - '/docker/appdata/pi-hole/etc-dnsmasq.d:/etc/dnsmasq.d'
    restart: unless-stopped